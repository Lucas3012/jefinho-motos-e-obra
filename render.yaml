services:
  - type: web
    name: jefinho-motos-e-obra
    runtime: node
    plan: free
    region: oregon

    # Build e inicialização no Render
    # --include=dev é obrigatório: o NODE_ENV=production abaixo faria o npm ci
    # ignorar as devDependencies, e é nelas que ficam tailwindcss e typescript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    # Discos persistentes / auto-deploy a partir do GitHub
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jefinho-motos-e-obra.onrender.com
      # A URL e a chave publicável do Supabase NÃO são segredos (elas vão
      # embutidas no JavaScript do navegador), por isso ficam aqui no repo.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://icchspesfqmeakbajlfh.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_f6m6zg_Lu0ZsFlZNPngfDw_gATzwmz2
      # >>> troque pelo WhatsApp real da loja, no painel do Render <<<
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      # Segredo de verdade: fica só no painel do Render, nunca no repo.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
